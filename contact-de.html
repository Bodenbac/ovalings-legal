<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ovalings · Kontakt</title><style>
:root { --bg: #f6f3f8; --fg: #1d1a24; --muted: #6a6478; --accent: #8e24aa; --line: #e3dcea; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg: #14111b; --fg: #f1edf7; --muted: #a59db5; --accent: #c77ddb; --line: #2f2939; color-scheme: dark } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif }
main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px }
h2 { font-size: 19px; margin: 32px 0 8px }
p, li { color: var(--muted) }
ul { padding-left: 20px }
nav { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--line) }
a { color: var(--accent) }

form { display: grid; gap: 12px }
label { display: grid; gap: 4px; font-weight: 600 }
input, select, textarea { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--fg) }
textarea { min-height: 160px; resize: vertical }
button { font: inherit; font-weight: 700; padding: 12px; border: 0; border-radius: 14px; background: var(--accent); color: var(--bg); cursor: pointer }
.trap { position: absolute; left: -9999px }
#status { min-height: 1.6em }
</style></head><body><main><nav><a href="privacy-de.html">Datenschutzerklärung</a><a href="terms-de.html">Nutzungsbedingungen</a><a href="imprint-de.html">Impressum</a><a href="contact-de.html">Kontakt</a><a href="contact.html" lang="en">English</a></nav><h1>Kontakt</h1><p>Fragen, Probleme, Ideen oder ein Anliegen zu deinen Daten: schreib uns. Wir antworten meist innerhalb von zwei Tagen.</p><form id="f"><label>Thema<select name="topic"><option value="support">Hilfe</option><option value="privacy">Datenschutz</option><option value="delete_account">Konto löschen</option><option value="bug">Fehler</option><option value="other">Sonstiges</option></select></label><label>Deine E-Mail-Adresse<input name="email" type="email" required maxlength="254" autocomplete="email"></label><label>Deine Nachricht<textarea name="message" required minlength="5" maxlength="5000"></textarea></label><input class="trap" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button type="submit">Senden</button><p id="status" role="status"></p><p>Deine E-Mail-Adresse nutzen wir nur für die Antwort.</p></form><script>
const f = document.getElementById('f'), status = document.getElementById('status');
const topic = new URLSearchParams(location.search).get('topic');
if (topic) f.topic.value = topic;
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = f.querySelector('button');
  button.disabled = true;
  try {
    const r = await fetch("https://kglxfxsccunylhbxquqz.supabase.co" + '/functions/v1/contact', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', apikey: "sb_publishable_Fc-CZcL6tfj1gVKR-psQbg_p2FS_yss"},
      body: JSON.stringify({...Object.fromEntries(new FormData(f)), source: 'web'}),
    });
    if (!r.ok) throw new Error(String(r.status));
    f.reset();
    status.textContent = "Danke, deine Nachricht ist angekommen.";
  } catch (_) {
    status.textContent = "Das Senden hat nicht geklappt. Prüfe deine E-Mail-Adresse und versuch es später noch einmal.";
  }
  button.disabled = false;
});
</script></main></body></html>
